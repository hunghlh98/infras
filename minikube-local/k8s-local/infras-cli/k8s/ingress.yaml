apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infras-cli
  namespace: infras-cli
  labels:
    app: infras-cli
  annotations:
    # NOTE: do NOT set `rewrite-target: /` here. With a `/` prefix and no capture
    # group it rewrites every request path to `/`, which breaks both the API
    # (/api/v1/...) and the UI (/ui/...). We forward paths unchanged instead.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: infras-cli.local
      http:
        paths:
          # API endpoints
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: infras-cli
                port:
                  number: 8000
          # Operator UI (served by the same FastAPI app)
          - path: /ui
            pathType: Prefix
            backend:
              service:
                name: infras-cli
                port:
                  number: 8000
          # Root, docs, openapi, metrics
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infras-cli
                port:
                  number: 8000
