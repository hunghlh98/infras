---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: infras-kafka
  labels:
    app: kafka
    component: broker
data:
  # Kafka server properties for KRaft mode
  server.properties: |
    # KRaft mode configuration
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@kafka-0.kafka-headless.infras-kafka.svc.cluster.local:29093
    cluster.id=MkU3OEVBNTcwNTJENDM2Qk

    # Listener configuration
    # External ports (cluster access): 9092-9094 PLAINTEXT, 9095-9097 SASL
    # Internal ports (pod internal): 290xx series for easy identification
    listeners=PLAINTEXT://0.0.0.0:9092,EXTERNAL_SASL://0.0.0.0:9095,INTERNAL_SASL://0.0.0.0:29095,BROKER://0.0.0.0:29091,CONTROLLER://0.0.0.0:29093
    # advertised.listeners: ONE address per listener; Kafka redirects clients here AFTER bootstrap.
    #   EXTERNAL_SASL:9095  -> kafka ClusterIP Service, for IN-CLUSTER SASL clients. Uses the STABLE
    #                          ClusterIP (kafka.infras-kafka...), NOT the kafka-0.kafka-headless pod
    #                          DNS: the ClusterIP survives broker pod restarts and is immune to stale
    #                          kafka-headless EndpointSlices. Safe here because it's a single broker
    #                          (a ClusterIP cannot address individual brokers in a multi-broker setup).
    #   INTERNAL_SASL:29095 -> localhost, for HOST access via `kubectl port-forward kafka-0 29095:29095`
    #   Never set EXTERNAL_SASL to localhost: in-cluster clients would reconnect to themselves and fail.
    advertised.listeners=PLAINTEXT://kafka-0.kafka-headless.infras-kafka.svc.cluster.local:9092,EXTERNAL_SASL://kafka.infras-kafka.svc.cluster.local:9095,INTERNAL_SASL://localhost:29095,BROKER://kafka-0.kafka-headless.infras-kafka.svc.cluster.local:29091
    inter.broker.listener.name=BROKER
    controller.listener.names=CONTROLLER
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT,EXTERNAL_SASL:SASL_PLAINTEXT,INTERNAL_SASL:SASL_PLAINTEXT,BROKER:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT

    # SASL authentication
    sasl.enabled.mechanisms=PLAIN
    sasl.mechanism.controller.protocol=PLAIN
    sasl.mechanism.inter.broker.protocol=PLAIN

    # Authorization
    authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
    allow.everyone.if.no.acl.found=false
    super.users=User:admin;User:kafka-1

    # Topic configuration
    num.partitions=1
    default.replication.factor=1
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1

    # Log retention
    log.retention.hours=168
    log.retention.bytes=1073741824

    # Performance tuning
    num.network.threads=3
    num.io.threads=8
    socket.send.buffer.bytes=102400
    socket.receive.buffer.bytes=102400
    socket.request.max.bytes=104857600

    # Group coordination
    group.initial.rebalance.delay.ms=0
