---
# Note: Run deploy.sh first to create the kafka-jaas-config Secret with Vault credentials
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: infras-kafka
  labels:
    app: kafka
    component: broker
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
      component: broker
  template:
    metadata:
      labels:
        app: kafka
        component: broker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9302"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
      - name: setup-jaas
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            # Copy JAAS config from Secret to writable volume
            cp /etc/kafka/jaas-secret/kafka_server_jaas.conf /etc/kafka/jaas/kafka_server_jaas.conf
            chmod 644 /etc/kafka/jaas/kafka_server_jaas.conf
            echo "JAAS config setup complete"
            ls -la /etc/kafka/jaas/
        volumeMounts:
          - name: kafka-jaas-secret
            mountPath: /etc/kafka/jaas-secret
            readOnly: true
          - name: kafka-jaas
            mountPath: /etc/kafka/jaas
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.6.1
        imagePullPolicy: IfNotPresent
        command:
          - bash
          - -c
          - |
            # Format storage if first run
            if [ ! -f /var/lib/kafka/data/meta.properties ]; then
              echo "First run - formatting storage..."
              kafka-storage format -t MkU3OEVBNTcwNTJENDM2Qk -c /etc/kafka/config/server.properties
            fi
            # Start Kafka
            export KAFKA_OPTS="-Djava.security.auth.login.config=/etc/kafka/jaas/kafka_server_jaas.conf"
            export KAFKA_HEAP_OPTS="-Xmx512M -Xms512M"
            exec kafka-server-start /etc/kafka/config/server.properties
        env:
          - name: KAFKA_NODE_ID
            value: "1"
          - name: KAFKA_BROKER_ID
            value: "1"
          - name: KAFKA_OPTS
            value: "-Djava.security.auth.login.config=/etc/kafka/jaas/kafka_server_jaas.conf"
          - name: KAFKA_HEAP_OPTS
            value: "-Xmx512M -Xms512M"
        ports:
          # External ports - 9092-9094 PLAINTEXT, 9095-9097 SASL
          - name: plaintext
            containerPort: 9092
            protocol: TCP
          - name: external-sasl
            containerPort: 9095
            protocol: TCP
          # Internal ports - 290xx series
          - name: internal-sasl
            containerPort: 29095
            protocol: TCP
          - name: broker
            containerPort: 29091
            protocol: TCP
          - name: controller
            containerPort: 29093
            protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
          - name: kafka-config
            mountPath: /etc/kafka/config
            readOnly: true
          - name: kafka-jaas
            mountPath: /etc/kafka/jaas
            readOnly: false
          - name: kafka-data
            mountPath: /var/lib/kafka/data
        # Health probes
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
        - name: kafka-config
          configMap:
            name: kafka-config
        - name: kafka-jaas-secret
          secret:
            secretName: kafka-jaas-config
            defaultMode: 0400
        - name: kafka-jaas
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
        labels:
          app: kafka
          component: broker
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
